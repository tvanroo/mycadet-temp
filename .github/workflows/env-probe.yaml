name: Env Probe
on: workflow_dispatch
jobs:
  no-env:
    runs-on: ubuntu-latest
    steps:
      - run: echo "no env"
  with-env:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - run: echo "with env"
  gate:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - run: echo "gate"
  env-after-gate:
    needs: gate
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.gate.outputs.proceed == 'true') }}
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - run: echo "env after gate"
